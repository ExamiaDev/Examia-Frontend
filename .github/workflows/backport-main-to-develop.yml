name: Backport to Develop

on:
  pull_request:
    types: [closed]
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número del PR original de main que se está backporteando (opcional, sólo informativo)"
        required: false
        default: "manual"

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  backport:
    runs-on: ubuntu-latest

    # Ejecutar si el PR fue mergeado exitosamente o si se dispara manualmente
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true

    env:
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
      PR_TITLE: ${{ github.event.pull_request.title || format('manual dispatch by @{0}', github.actor) }}
      BACKPORT_BRANCH: backport/main-to-develop-pr-${{ github.event.pull_request.number || format('{0}-{1}', inputs.pr_number, github.run_id) }}

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: develop

      - name: Setup Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Create backport branch and merge main
        id: merge
        run: |
          git fetch origin main develop
          # Crear (o recrear) la rama de backport a partir de develop
          git checkout -B "$BACKPORT_BRANCH" origin/develop

          if git merge --no-ff origin/main -m "chore: backport main into develop (PR #${PR_NUMBER})"; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
            echo "✅ Merge limpio de main hacia develop."
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ Conflictos detectados. Se commitean los marcadores para revisión manual."
            git add -A
            git commit -m "chore: backport main into develop with conflicts (PR #${PR_NUMBER}) [needs manual resolution]" || true
          fi

          # ¿Hay realmente algo nuevo para backportear?
          new_commits="$(git rev-list --count origin/develop..HEAD)"
          echo "new_commits=$new_commits"
          if [ "$new_commits" -eq 0 ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "ℹ️ develop ya está al día con main; no hay nada para backportear."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            git push origin "$BACKPORT_BRANCH" --force-with-lease
          fi

      - name: Open or update backport pull request
        id: cpr
        if: steps.merge.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
        with:
          script: |
            const { BACKPORT_BRANCH, PR_NUMBER, PR_TITLE, CONFLICTS } = process.env;
            const conflicts = CONFLICTS === 'true';
            const body = [
              '🤖 **Backport automático de `main` a `develop`**',
              '',
              `Este PR integra los cambios mergeados a \`main\` desde el PR #${PR_NUMBER} (${PR_TITLE}) hacia \`develop\` para mantener ambas ramas sincronizadas.`,
              '',
              conflicts
                ? '⚠️ **Hay conflictos de merge** en esta rama. Resuélvelos manualmente (los marcadores `<<<<<<<` están commiteados) antes de mergear.'
                : '✅ Sin conflictos. Listo para revisión y merge.',
            ].join('\n');

            const { owner, repo } = context.repo;
            const headRef = `${owner}:${BACKPORT_BRANCH}`;

            const { data: existing } = await github.rest.pulls.list({
              owner,
              repo,
              head: headRef,
              base: 'develop',
              state: 'open',
            });

            let pr;
            if (existing.length > 0) {
              pr = existing[0];
              await github.rest.pulls.update({
                owner,
                repo,
                pull_number: pr.number,
                body,
              });
              core.info(`Updated existing backport PR #${pr.number}`);
            } else {
              const { data: created } = await github.rest.pulls.create({
                owner,
                repo,
                head: BACKPORT_BRANCH,
                base: 'develop',
                title: `chore: backport main → develop (PR #${PR_NUMBER})`,
                body,
              });
              pr = created;
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number: pr.number,
                  labels: ['backport', 'automated'],
                });
              } catch (err) {
                core.warning(`No se pudieron añadir labels: ${err.message}`);
              }
              core.info(`Created backport PR #${pr.number}`);
            }

            core.setOutput('pull-request-url', pr.html_url);
            core.setOutput('pull-request-number', String(pr.number));

      - name: Comment on original PR
        if: github.event_name == 'pull_request' && steps.cpr.outputs.pull-request-url != ''
        uses: actions/github-script@v7
        env:
          CONFLICTS: ${{ steps.merge.outputs.conflicts }}
          BACKPORT_URL: ${{ steps.cpr.outputs.pull-request-url }}
        with:
          script: |
            const conflicts = process.env.CONFLICTS === 'true';
            const url = process.env.BACKPORT_URL;
            const body = conflicts
              ? `⚠️ **Backport a \`develop\` requiere revisión manual**\n\nHay conflictos al integrar los cambios. PR de backport: ${url}`
              : `✅ **Backport a \`develop\` creado**\n\nPR: ${url}`;
            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Comment if no backport was needed
        if: github.event_name == 'pull_request' && steps.merge.outputs.has_changes != 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: Number(process.env.PR_NUMBER),
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: 'ℹ️ **Backport a `develop`**: no fue necesario crear un PR (develop ya estaba al día con main).',
            });
